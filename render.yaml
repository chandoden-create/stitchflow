services:
  # StitchFlow NestJS Backend API
  - type: web
    name: stitchflow-api-chandoden
    env: node
    plan: free
    rootDir: backend
    buildCommand: npm install --legacy-peer-deps && npx prisma generate && npm run build
    startCommand: npx prisma db push && npm run prisma:seed && npm run start:prod
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20.14.0
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: stitchflow-db
          property: connectionString
      - key: REDIS_HOST
        value: ""
      - key: REDIS_PORT
        value: "6379"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 365d
      - key: WHATSAPP_SANDBOX_MODE
        value: "true"
      - key: WHATSAPP_VERIFY_TOKEN
        value: stitchflow-webhook-verify

  # StitchFlow Mobile Web Frontend
  - type: web
    name: stitchflow-mobile
    env: static
    rootDir: mobile
    buildCommand: npx expo export -p web
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: CI
        value: "1"
      - key: NODE_VERSION
        value: 20.14.0
      - key: NPM_FLAGS
        value: "--ignore-scripts --legacy-peer-deps"
      - key: EXPO_PUBLIC_APP_NAME
        value: StitchFlow
      - key: EXPO_PUBLIC_CURRENCY_SYMBOL
        value: "₹"
      - key: EXPO_PUBLIC_API_URL
        value: https://stitchflow-api-chandoden.onrender.com

databases:
  # Managed PostgreSQL Database (Free)
  - name: stitchflow-db
    plan: free
    databaseName: stitchflow
    user: stitchflow
