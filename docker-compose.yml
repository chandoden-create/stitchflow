services:
  postgres:
    image: postgres:16-alpine
    container_name: stitchflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: stitchflow
      POSTGRES_USER: stitchflow
      POSTGRES_PASSWORD: stitchflow_dev
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stitchflow -d stitchflow']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: stitchflow-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stitchflow-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      PORT: 3000
      NODE_ENV: production
      DATABASE_URL: postgresql://stitchflow:stitchflow_dev@postgres:5432/stitchflow?schema=public
      JWT_SECRET: stitchflow-production-secret-replace-with-secure-random-key
      REDIS_HOST: redis
      REDIS_PORT: 6379
      S3_ENDPOINT: ""
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ""
      S3_SECRET_KEY: ""
      S3_BUCKET: stitchflow-photos
      S3_FORCE_PATH_STYLE: "false"
      WHATSAPP_SANDBOX_MODE: "true"
      WHATSAPP_VERIFY_TOKEN: stitchflow-webhook-verify
    ports:
      - '3000:3000'

volumes:
  postgres_data:
  redis_data:
